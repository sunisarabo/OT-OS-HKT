<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT รายชื่อพนักงาน — KP / LP / LL</title>
<style>
:root{
  --bg:#f7f7f5;--card:#fff;--txt:#1a1a18;--txt2:#5f5e5a;--txt3:#8a8a82;
  --br:rgba(0,0,0,.12);--br2:rgba(0,0,0,.22);--soft:#f2f3f5;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Sarabun','Helvetica Neue',sans-serif;
  --KP:#2563eb;--LP:#a855f7;--LL:#0d9488;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--txt);padding:14px;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;font-weight:600}
.sub{font-size:12.5px;color:var(--txt2);margin-top:3px}
.deptbar{display:flex;background:var(--card);border:.5px solid var(--br);border-radius:9px;padding:3px;gap:2px}
.deptbtn{padding:7px 18px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;color:var(--txt2)}
.deptbtn.on{color:#fff}
.deptbtn.on.KP{background:var(--KP)}.deptbtn.on.LP{background:var(--LP)}.deptbtn.on.LL{background:var(--LL)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:7px 13px;border:.5px solid var(--br);border-radius:8px;background:var(--card);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--br2);background:var(--soft)}
.btn.primary{background:#e6f1fb;color:#185fa5;border-color:#85b7eb}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto}
.tab{padding:6px 14px;border:.5px solid var(--br);border-radius:8px;background:var(--card);cursor:pointer;font-size:12.5px;color:var(--txt2);white-space:nowrap;font-family:var(--font)}
.tab.on{background:#1a1a18;color:#f5f5f3;border-color:transparent;font-weight:500}
.tab.mon.on{background:#e6f1fb;color:#185fa5}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column}}
.metric{background:var(--card);border:.5px solid var(--br);border-radius:9px;padding:12px 14px}
.metric .l{font-size:11.5px;color:var(--txt2);margin-bottom:5px}
.metric .v{font-size:19px;font-weight:600}
.metric .s{font-size:11px;color:var(--txt3);margin-top:2px}
.card{background:var(--card);border:.5px solid var(--br);border-radius:11px;padding:14px 16px;margin-bottom:14px;overflow:hidden}
.teamhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:9px;border-bottom:.5px solid var(--br)}
.teamname{font-size:14px;font-weight:600}
.teamsum{font-size:12px;color:var(--txt2)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;font-weight:500;color:var(--txt2);text-align:left;padding:7px 9px;border-bottom:.5px solid var(--br);background:var(--soft);white-space:nowrap}
td{padding:6px 9px;border-bottom:.5px solid var(--br);white-space:nowrap}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--soft)}
.tot td{font-weight:600;background:var(--soft)}
.bar{display:flex;align-items:center;gap:8px}
.barbg{height:6px;border-radius:3px;background:var(--br);flex:1;min-width:46px}
.barfill{height:6px;border-radius:3px}
.note{padding:9px 13px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none}
.note.show{display:block}
.note.err{background:#fee2e2;color:#b91c1c;border:.5px solid #fca5a5}
.note.info{background:#e6f1fb;color:#185fa5;border:.5px solid #85b7eb}
.note.ok{background:#dcfce7;color:#15803d;border:.5px solid #86efac}
.spin{width:14px;height:14px;border:2px solid #0002;border-top-color:#185fa5;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--txt2);font-size:13px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  .actions,.deptbar,.tabs,.note,.btn{display:none!important}
  .card{break-inside:avoid;border:1px solid #cbd5e1}
  th{background:#f1f5f9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>รายงาน OT รายชื่อพนักงาน</h1>
      <div class="sub" id="sub">แยก 3 แผนก KP / LP / LL · รายสัปดาห์ + รายเดือน</div>
    </div>
    <div class="deptbar" id="deptbar"></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="btnReload" onclick="load(true)">↻ โหลดข้อมูลใหม่</button>
    <button class="btn" onclick="exportCsv()">⬇ Export CSV</button>
    <button class="btn" onclick="window.print()">🖨 Print / PDF</button>
    <span class="sub" id="meta" style="margin-left:auto;align-self:center"></span>
  </div>

  <div class="note" id="note"></div>
  <div class="tabs" id="months"></div>
  <div id="metrics" class="metrics" style="display:none"></div>
  <div id="content"></div>
</div>

<script>
var DATA=null, dept='KP', month=null;
var DEPT_COLOR={KP:'#2563eb',LP:'#a855f7',LL:'#0d9488'};

function note(msg,type){var n=document.getElementById('note');n.innerHTML=msg;n.className='note show '+(type||'info');if(type==='ok')setTimeout(function(){n.classList.remove('show')},4000);}
function fmtH(min){if(!min)return '0:00';var h=Math.floor(min/60),m=Math.round(min%60);return h.toLocaleString('en-US')+':'+('0'+m).slice(-2);}
function hrs(min){return (min/60);}
function fmtHrs(min){return (min/60).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:1});}

function load(force){
  document.getElementById('btnReload').innerHTML='<span class="spin"></span> กำลังโหลด...';
  note('กำลังดึงข้อมูลจาก Google Sheets (OT Yearly + Pax Manpower)...','info');
  if(typeof google==='undefined'||!google.script||!google.script.run){
    note('✗ ต้องเปิดผ่าน Apps Script Web App (google.script.run ไม่พร้อม)','err');
    document.getElementById('btnReload').innerHTML='↻ โหลดข้อมูลใหม่';
    return;
  }
  var run=google.script.run.withSuccessHandler(onData).withFailureHandler(function(e){
    note('✗ '+(e&&e.message||e),'err');
    document.getElementById('btnReload').innerHTML='↻ โหลดข้อมูลใหม่';
  });
  if(force&&run.clearEmployeeCache){google.script.run.withSuccessHandler(function(){run.getEmployeeReport();}).clearEmployeeCache();}
  else run.getEmployeeReport();
}

function onData(d){
  document.getElementById('btnReload').innerHTML='↻ โหลดข้อมูลใหม่';
  if(!d||d._error){note('✗ '+((d&&d._error)||'ไม่มีข้อมูล'),'err');return;}
  DATA=d;
  if(d.meta){document.getElementById('meta').textContent='ชีต: '+d.meta.sheet+' · map '+d.meta.mappingCount+' คน'+(d.cached?' · cached':'');}
  if(!month||d.months.indexOf(month)<0)month=d.months[d.months.length-1];
  renderDeptBar();renderMonths();render();
  note('✓ โหลดสำเร็จ ('+d.months.length+' เดือน)','ok');
}

function renderDeptBar(){
  document.getElementById('deptbar').innerHTML=DATA.depts.map(function(x){
    return '<button class="deptbtn '+x.code+(x.code===dept?' on':'')+'" onclick="setDept(\''+x.code+'\')">'+x.code+'</button>';
  }).join('');
}
function setDept(c){dept=c;renderDeptBar();render();}
function renderMonths(){
  document.getElementById('months').innerHTML=DATA.months.map(function(m){
    return '<button class="tab mon'+(m===month?' on':'')+'" onclick="setMonth(\''+m+'\')">'+m+'</button>';
  }).join('');
}
function setMonth(m){month=m;renderMonths();render();}

function deptObj(){return (DATA&&DATA.report[month]&&DATA.report[month][dept])||null;}

function render(){
  var info=DATA.depts.filter(function(x){return x.code===dept})[0]||{name:dept};
  document.getElementById('sub').textContent=info.name+' · '+month+' · รายสัปดาห์ (W1–W4) + รวมเดือน';
  var b=deptObj();
  var mx=document.getElementById('metrics');
  if(!b||!b.employees.length){
    mx.style.display='none';
    document.getElementById('content').innerHTML='<div class="card empty">ไม่มีข้อมูล OT ของแผนก '+dept+' ในเดือน '+month+'</div>';
    return;
  }
  // metrics
  var teams=Object.keys(b.teams).sort(function(a,c){return b.teams[c].total_min-b.teams[a].total_min;});
  var top=b.employees[0];
  mx.style.display='grid';
  mx.innerHTML=
    metric('OT รวม — '+dept,fmtH(b.total_min)+' ชม.',b.headcount+' รายการ-คน')+
    metric('พนักงานที่ทำ OT',b.headcount+' คน',teams.length+' ทีมย่อย')+
    metric('สูงสุดรายคน',top?top.name:'-',top?fmtH(top.total_min)+' ชม.':'')+
    metric('ทีมสูงสุด',teams[0]||'-',teams[0]?fmtH(b.teams[teams[0]].total_min)+' ชม.':'');

  // per-team grouped tables (PDF style)
  var html='';
  var col=DEPT_COLOR[dept];
  teams.forEach(function(tn){
    var emps=b.employees.filter(function(e){return e.team===tn});
    if(!emps.length)return;
    var tt=b.teams[tn];
    var maxv=Math.max.apply(null,emps.map(function(e){return e.total_min;}));
    html+='<div class="card"><div class="teamhead"><div class="teamname" style="color:'+col+'">'+tn+'</div>'+
      '<div class="teamsum">'+emps.length+' คน · รวม '+fmtH(tt.total_min)+' ชม.</div></div><div class="tw"><table>'+
      '<thead><tr><th>ลำดับ</th><th>รหัส</th><th>ชื่อ - สกุล</th>'+
      '<th class="num">W1</th><th class="num">W2</th><th class="num">W3</th><th class="num">W4</th>'+
      '<th class="num">รวมเดือน (ชม.)</th></tr></thead><tbody>';
    emps.forEach(function(e,i){
      html+='<tr><td>'+(i+1)+'</td><td style="color:var(--txt2)">'+e.code+'</td><td>'+esc(e.name)+'</td>'+
        '<td class="num">'+(e.weeks[0]?fmtH(e.weeks[0]):'-')+'</td>'+
        '<td class="num">'+(e.weeks[1]?fmtH(e.weeks[1]):'-')+'</td>'+
        '<td class="num">'+(e.weeks[2]?fmtH(e.weeks[2]):'-')+'</td>'+
        '<td class="num">'+(e.weeks[3]?fmtH(e.weeks[3]):'-')+'</td>'+
        '<td class="num"><div class="bar"><div class="barbg"><div class="barfill" style="width:'+Math.round(e.total_min/maxv*100)+'%;background:'+col+'"></div></div><span style="min-width:52px;text-align:right;font-weight:600">'+fmtH(e.total_min)+'</span></div></td></tr>';
    });
    // team total row
    var wt=[0,0,0,0];emps.forEach(function(e){for(var k=0;k<4;k++)wt[k]+=e.weeks[k];});
    html+='<tr class="tot"><td colspan="3">รวมทีม '+tn+'</td>'+
      '<td class="num">'+fmtH(wt[0])+'</td><td class="num">'+fmtH(wt[1])+'</td><td class="num">'+fmtH(wt[2])+'</td><td class="num">'+fmtH(wt[3])+'</td>'+
      '<td class="num">'+fmtH(tt.total_min)+'</td></tr>';
    html+='</tbody></table></div></div>';
  });
  document.getElementById('content').innerHTML=html;
}

function metric(l,v,s){return '<div class="metric"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+(s||'')+'</div></div>';}
function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function exportCsv(){
  if(!DATA){return;}
  var rows=[['รายงาน OT รายชื่อ — แผนก '+dept,'เดือน '+month]];
  rows.push(['ลำดับ','รหัสพนักงาน','ชื่อ - สกุล','ทีม','W1','W2','W3','W4','รวมเดือน(ชม.)']);
  var b=deptObj();if(!b){return;}
  var teams=Object.keys(b.teams).sort(function(a,c){return b.teams[c].total_min-b.teams[a].total_min;});
  teams.forEach(function(tn){
    b.employees.filter(function(e){return e.team===tn}).forEach(function(e,i){
      rows.push([i+1,e.code,e.name,tn,fmtH(e.weeks[0]),fmtH(e.weeks[1]),fmtH(e.weeks[2]),fmtH(e.weeks[3]),fmtH(e.total_min)]);
    });
  });
  rows.push(['','','','รวมแผนก '+dept,'','','','',fmtH(b.total_min)]);
  var csv=rows.map(function(r){return r.map(function(c){var s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='OT-'+dept+'_'+month.replace(' ','-')+'.csv';a.click();URL.revokeObjectURL(a.href);
  note('✓ Export CSV สำเร็จ','ok');
}

load(false);
</script>
</body>
</html>
