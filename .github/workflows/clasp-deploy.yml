name: Deploy to Apps Script (clasp)

on:
  push:
    branches: [ main, claude/confident-lamport-4lqfh5 ]
    paths: [ 'gas/**' ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install clasp 3.3.0
        run: npm install -g @google/clasp@3.3.0
      - name: clasp push → Apps Script
        working-directory: gas
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret CLASPRC_JSON — ข้าม"
            exit 0
          fi
          echo "clasp version: $(clasp --version)"
          # เขียน token ลงทั้ง 2 path ที่ clasp v3 อาจอ่าน
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          mkdir -p "$HOME/.config/clasp"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.config/clasp/.clasprc.json"
          # DEBUG: โชว์เฉพาะชื่อ key (ไม่โชว์ค่า token) เพื่อตรวจโครงสร้าง
          echo "--- ~/.clasprc.json size: $(wc -c < "$HOME/.clasprc.json") bytes ---"
          node -e "try{const c=require(require('os').homedir()+'/.clasprc.json');console.log('TOP KEYS:',JSON.stringify(Object.keys(c)));for(const k of Object.keys(c)){if(c[k]&&typeof c[k]==='object')console.log('  '+k+' keys:',JSON.stringify(Object.keys(c[k])));}}catch(e){console.log('PARSE ERROR:',e.message)}"
          echo "--- .clasp.json ---"; cat .clasp.json
          echo "--- clasp push ---"
          clasp push --force
