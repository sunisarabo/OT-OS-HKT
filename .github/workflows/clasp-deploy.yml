name: Deploy to Apps Script (clasp)

on:
  push:
    branches: [ main, claude/confident-lamport-4lqfh5 ]
    paths: [ 'gas/**' ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install clasp 3.3.0
        run: npm install -g @google/clasp@3.3.0
      - name: clasp push → Apps Script
        working-directory: gas
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set +e
          if [ -z "$CLASPRC_JSON" ]; then echo "::warning::no CLASPRC_JSON secret"; exit 0; fi
          echo "clasp version: $(clasp --version 2>&1)"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "rc size: $(wc -c < "$HOME/.clasprc.json") bytes"
          node -e "try{const c=require(require('os').homedir()+'/.clasprc.json');console.log('TOP KEYS:',JSON.stringify(Object.keys(c)));for(const k of Object.keys(c)){if(c[k]&&typeof c[k]==='object'){console.log(' '+k+':',JSON.stringify(Object.keys(c[k])));for(const k2 of Object.keys(c[k])){if(c[k][k2]&&typeof c[k][k2]==='object')console.log('   '+k+'.'+k2+':',JSON.stringify(Object.keys(c[k][k2])));}}}}catch(e){console.log('PARSE ERROR:',e.message)}"
          echo "--- clasp push ---"
          clasp push --force 2>&1
          echo "clasp push exit code: $?"
