name: Deploy to Apps Script (clasp)

# push เข้า repo (ไฟล์ใน gas/ เปลี่ยน) → clasp push เข้าโปรเจกต์ OT อัตโนมัติ
on:
  push:
    branches: [ main, claude/confident-lamport-4lqfh5 ]
    paths: [ 'gas/**' ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install clasp 3.3.0
        run: npm install -g @google/clasp@3.3.0
      - name: clasp push → Apps Script
        working-directory: gas
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret CLASPRC_JSON — ข้าม (ดู gas/CLASP_AUTODEPLOY.md)"
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          clasp --version
          clasp push --force
      - name: Redeploy web app (update /exec)
        working-directory: gas
        continue-on-error: true
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "no secret, skip"; exit 0; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          clasp deploy --deploymentId "AKfycbxyiEYq_U7fdaPQ_6tUbMg4iApdejjl3ns5wSvUuN1jeRvKDSmizjJ28zVLFSk3iQxgHg" --description "auto $(date -u +%FT%TZ)" || echo "::warning::clasp deploy failed (ตรวจ flag/permission) — โค้ดอัปเดตแล้วแต่ /exec ยังเวอร์ชันเก่า ใช้ /dev ได้"
